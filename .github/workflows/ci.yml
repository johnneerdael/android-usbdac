name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recheck:
        description: Retry checks at the selected revision
        type: choice
        required: true
        options:
          - rust-lint
          - qemu-uac1
          - qemu-usb-lifecycle
          - rust-lint-and-qemu-uac1
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      reservation_run_id:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.android.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.android.outputs.artifact_digest }}
      # The attempt that uploaded the payload. "Re-run failed jobs" keeps this
      # output, and the payload, from the earlier attempt when the job is not re-run.
      artifact_attempt:
        value: ${{ jobs.android.outputs.artifact_attempt }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ (inputs.source_sha != '' || inputs.recheck != '') && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.91.1
  # The NDK the native build is pinned to (android/usbdac/build.gradle.kts, ndkVersion).
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2

jobs:
  rust:
    if: inputs.recheck != 'qemu-uac1' && inputs.recheck != 'qemu-usb-lifecycle'
    name: Rust tests and Android check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the NDK
        if: inputs.recheck == ''
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify generated capability and result status
        if: inputs.recheck == ''
        run: |
          cargo run --quiet --locked -p usbdac-core --example support_manifest > target/shipped-support.json
          python3 -I .github/scripts/generate_evidence.py --check --capabilities target/shipped-support.json

      - name: Test (host)
        if: inputs.recheck == ''
        run: cargo test --workspace --locked

      - name: Check (aarch64-linux-android)
        if: inputs.recheck == ''
        # libusb is compiled from source, so the NDK's clang has to be reachable.
        run: |
          export PATH="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export AR_aarch64_linux_android=llvm-ar
          cargo check --workspace --locked --target aarch64-linux-android

  guide:
    if: inputs.recheck == ''
    name: Guide code samples
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      # Every code block of docs/sdk must be an excerpt of the sample app, which the next job compiles.
      - name: Check that the guide's code comes from the sample
        run: python3 -I .github/scripts/check_docs_snippets.py

  # Not a release gate: Release checks the pin itself and runs these gates on reserved source.
  release-scripts:
    if: inputs.source_sha == '' && inputs.recheck == ''
    name: Release scripts and pinned implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release refuses an unpinned implementation; catch that before merge (.github/release-recovery.md).
      - name: Check the pinned release implementation
        run: python3 -I .github/scripts/pin_release_adapter.py --check

      - name: Run the release script tests from the repository root
        run: python3 -B -m unittest discover -s .github/scripts/tests

      - name: Run the release script tests from their directory
        working-directory: .github/scripts/tests
        run: python3 -B -m unittest discover -s .

  android:
    if: inputs.recheck == ''
    outputs:
      artifact_id: ${{ steps.release_payload.outputs.artifact-id }}
      artifact_digest: ${{ steps.release_payload.outputs.artifact-digest }}
      artifact_attempt: ${{ github.run_attempt }}
    name: AAR, unit tests and sample
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the Gradle distribution checksum
        run: |
          echo 'distributionSha256Sum=17f277867f6914d61b1aa02efab1ba7bb439ad652ca485cd8ca6842fccec6e43' >> android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Rust and the Android targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.8+9"

      - name: Install the Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Plugin downloads from the Gradle and Maven repositories fail intermittently on
      # hosted runners. Resolve them first, with retries, so a transient outage does not
      # fail the build.
      - name: Resolve Gradle plugins (with retries)
        working-directory: android
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew help -Pusbdac.skipNative=true --console=plain -q; then exit 0; fi
            echo "Plugin resolution failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Build host JNI for real-core selector ranking
        run: cargo build --locked -p usbdac-jni

      # The :usbdac build runs `cargo ndk` for arm64-v8a, armeabi-v7a, x86_64 and x86.
      - name: Build the AAR, run the unit tests, build the sample
        working-directory: android
        env:
          USBDAC_TEST_HOST_JNI: ${{ github.workspace }}/target/debug/libusbdac.so
          USBDAC_TEST_DSD_PCM: "1"
        run: ./gradlew :usbdac:assembleRelease :usbdac:testDebugUnitTest :sample:assembleDebug :usbdac-media3:testDebugUnitTest :usbdac-media3:assembleRelease :media3-example:assembleDebug :media3-example:testDebugUnitTest --console=plain

      - name: Check that the AAR carries every ABI
        run: |
          listing=$(unzip -l android/usbdac/build/outputs/aar/usbdac-release.aar)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "$listing" | grep -q "jni/$abi/libusbdac.so" || { echo "jni/$abi/libusbdac.so is missing from the AAR"; exit 1; }
          done

      - name: Stage immutable release deliverables
        if: inputs.source_sha != ''
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESERVATION_RUN_ID: ${{ inputs.reservation_run_id }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.github/scripts/release_artifact.py" > "$RUNNER_TEMP/release_artifact.py"
          (cd android && ./gradlew :usbdac:publishReleasePublicationToStagingRepository :usbdac-media3:publishReleasePublicationToStagingRepository --console=plain)
          cargo package --locked -p usbdac-core --no-verify
          python3 -I "$RUNNER_TEMP/release_artifact.py" stage release-payload --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: release_payload
        if: inputs.source_sha != ''
        with:
          name: release-payload-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.source_sha }}
          path: release-payload/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usbdac-aar-and-sample
          path: |
            android/usbdac/build/outputs/aar/usbdac-release.aar
            android/sample/build/outputs/apk/debug/sample-debug.apk
          retention-days: 7

      # The validator APK itself is built by the Release workflow with the validator's native
      # feature; here its Kotlin and Compose UI only has to compile. Runs last so it cannot
      # touch the native outputs the staging step above relies on.
      - name: Compile the validator app
        working-directory: android
        run: ./gradlew :validator:compileDebugKotlin -Pusbdac.skipNative=true --console=plain

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: unit-test-reports
          path: |
            android/usbdac/build/reports/tests
            android/usbdac-media3/build/reports/tests
          retention-days: 7

  defensive-fuzz:
    if: inputs.recheck == ''
    name: Defensive USB parsers (bounded fuzz and Miri)
    runs-on: ubuntu-24.04
    # Miri includes the full two-million-byte threaded JNI ring stress test.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install nightly defensive tooling
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          rustup default nightly
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Exercise untrusted parser and control replies (ASan)
        run: python3 -I .github/scripts/run_defensive_fuzz.py --seconds 60 --log target/defensive-fuzz-sanitized/report.jsonl
      - name: Check pure loss accounting and ring memory under Miri
        run: |
          cargo miri setup
          cargo miri test --locked -p usbdac-core --lib iso_transport_loss
          cargo miri test --locked -p usbdac-core --lib ring_pops_report_how_much_of_the_output_was_music
          cargo miri test --locked -p usbdac-jni --lib ring
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: defensive-parser-artifacts
          path: target/defensive-fuzz-sanitized/report.jsonl
          retention-days: 7

  qemu-usb:
    if: inputs.recheck != 'rust-lint' && inputs.recheck != 'qemu-usb-lifecycle'
    name: QEMU UAC1 playback, reconfigure and two owners
    # Noble ships QEMU8.2.2 whose UAC1 AC descriptors incorrectly advertise
    # protocol0x04; Resolute ships fixed QEMU10.2.1. Keep strict driver/probe gates.
    # https://github.com/qemu/qemu/blob/v8.2.2/hw/usb/dev-audio.c
    # https://github.com/qemu/qemu/blob/v10.2.1/hw/usb/dev-audio.c
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install virtual USB guest prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 musl-tools linux-libc-dev cpio libarchive-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build then run the bounded virtual UAC1 acceptance
        run: bash .github/scripts/qemu_usb_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qemu-uac1-evidence
          path: |
            target/qemu-usb-smoke/acceptance.log
            target/qemu-usb-smoke/acceptance-window.txt
            target/qemu-usb-smoke/qemu-version.txt
            target/qemu-usb-smoke/SHA256SUMS
          retention-days: 7

  qemu-usb-lifecycle:
    if: inputs.recheck == '' || inputs.recheck == 'qemu-usb-lifecycle'
    name: QEMU USB/IP lifecycle and JNI retirement
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install guest build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-arm musl-tools linux-libc-dev cpio unzip
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-unknown-linux-musl
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.8+9"
      - name: Build pinned guest and production probes
        run: .github/usb-lifecycle/run.sh build
      - name: Run bounded USB/IP acceptance
        run: .github/usb-lifecycle/run.sh run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: usb-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/usb-lifecycle/manifest.txt
            target/usb-lifecycle/runtime.SHA256
            target/usb-lifecycle/acceptance-window.txt
            target/usb-lifecycle/serial.log
            target/usb-lifecycle/modes/
            target/usb-lifecycle/initramfs.gz
            target/usb-lifecycle/vmlinuz-lts
          if-no-files-found: error
          retention-days: 7
