name: Release

# A version tag publishes the Android AAR to GitHub Packages and the Rust core to crates.io.
# "Run workflow" can release an existing tag and optionally skip the GitHub Packages upload.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.1.0
        required: true
        type: string
      skip_package:
        description: Skip the Android AAR upload to GitHub Packages
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  package:
    name: Build, test and publish the package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag matches the version
        id: version
        run: |
          gradle_version=$(sed -n 's/^VERSION_NAME=//p' android/gradle.properties)
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[profile/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml)
          echo "tag=$TAG gradle=$gradle_version cargo=$cargo_version"
          if [ -z "$gradle_version" ] || [ -z "$cargo_version" ]; then
            echo "could not read the version from android/gradle.properties or Cargo.toml"; exit 1
          fi
          if [ "$gradle_version" != "$cargo_version" ]; then
            echo "android/gradle.properties says $gradle_version but the Cargo workspace says $cargo_version"; exit 1
          fi
          if [ "$TAG" != "v$gradle_version" ]; then
            echo "the tag is $TAG but the version is $gradle_version (expected v$gradle_version)"; exit 1
          fi
          echo "version=$gradle_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust and the Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test the Rust workspace
        run: cargo test --workspace

      # Plugin downloads from the Gradle and Maven repositories fail intermittently on
      # hosted runners. Resolve them first, with retries, so a transient outage does not
      # fail the build.
      - name: Resolve Gradle plugins (with retries)
        working-directory: android
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew help -Pusbdac.skipNative=true --console=plain -q; then exit 0; fi
            echo "Plugin resolution failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Build the AAR (all four ABIs), run the unit tests, build the sample
        working-directory: android
        run: ./gradlew :usbdac:assembleRelease :usbdac:testDebugUnitTest :sample:assembleDebug --console=plain

      - name: Check that the AAR carries every ABI
        run: |
          listing=$(unzip -l android/usbdac/build/outputs/aar/usbdac-release.aar)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "$listing" | grep -q "jni/$abi/libusbdac.so" || { echo "jni/$abi/libusbdac.so is missing from the AAR"; exit 1; }
          done

      - name: Stage the Maven publication
        working-directory: android
        run: ./gradlew :usbdac:publishReleasePublicationToStagingRepository --console=plain

      - name: Include license and attribution in packages from older tags
        run: |
          for notice in LICENSE NOTICE; do
            if [ ! -e "crates/usbdac-core/$notice" ]; then
              cp "$notice" crates/usbdac-core/
            fi
          done

      - name: Check whether the Rust crate version is published
        id: crates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output "$RUNNER_TEMP/usbdac-core-index.jsonl" --write-out '%{http_code}' \
            https://index.crates.io/us/bd/usbdac-core)
          case "$status" in
            200)
              published=$(jq -s --arg version "$VERSION" 'any(.[]; .vers == $version)' \
                "$RUNNER_TEMP/usbdac-core-index.jsonl")
              ;;
            404) published=false ;;
            *) echo "crates.io index returned HTTP $status"; exit 1 ;;
          esac
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "usbdac-core $VERSION already published: $published"

      - name: Publish the Rust crate to crates.io
        if: steps.crates.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: cargo publish --locked --allow-dirty --package usbdac-core

      - name: Publish to GitHub Packages
        if: ${{ github.event_name == 'push' || !inputs.skip_package }}
        working-directory: android
        env:
          # The build reads GITHUB_ACTOR and GITHUB_REPOSITORY, which Actions sets, and this token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :usbdac:publishReleasePublicationToGitHubPackagesRepository --console=plain

      - name: Collect the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED_MAVEN: ${{ github.event_name == 'push' || !inputs.skip_package }}
        run: |
          set -euo pipefail
          assets="$PWD/release-assets"
          mkdir -p "$assets"
          staged="android/build/staging/dev/usbdac/usbdac/$VERSION"
          cp "$staged/usbdac-$VERSION.aar" "$staged/usbdac-$VERSION-sources.jar" \
             "$staged/usbdac-$VERSION.pom" "$staged/usbdac-$VERSION.module" "$assets/"

          # The native libraries on their own, one directory per ABI.
          (cd android/usbdac/src/main/jniLibs && zip -r -X "$assets/usbdac-$VERSION-jniLibs.zip" .)

          # The Rust driver as a crate (sources only; libusb is compiled from the crates.io dependency).
          cargo package -p usbdac-core --allow-dirty --no-verify
          cp "target/package/usbdac-core-$VERSION.crate" "$assets/"

          (cd "$assets" && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

          # Release notes from the commits since the previous tag.
          previous=$(git describe --tags --abbrev=0 "refs/tags/$TAG^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "$previous..refs/tags/$TAG"
            else
              git log --no-merges --pretty='- %s (%h)' "refs/tags/$TAG"
            fi
            echo
            echo "## Files"
            echo
            if [ "$PUBLISHED_MAVEN" = true ]; then
              echo "- \`usbdac-$VERSION.aar\`, \`-sources.jar\`, \`.pom\`, \`.module\`: the Android library, also published to GitHub Packages as \`dev.usbdac:usbdac:$VERSION\`."
            else
              echo "- \`usbdac-$VERSION.aar\`, \`-sources.jar\`, \`.pom\`, \`.module\`: the Android library and its Maven metadata."
            fi
            echo "- \`usbdac-$VERSION-jniLibs.zip\`: \`libusbdac.so\` for arm64-v8a, armeabi-v7a, x86_64 and x86."
            echo "- \`usbdac-core-$VERSION.crate\`: the Rust USB DAC driver, also available as [usbdac-core $VERSION on crates.io](https://crates.io/crates/usbdac-core/$VERSION)."
            echo "- \`SHA256SUMS.txt\`: SHA-256 checksums of the files above."
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            release-assets/*
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create the GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          files=$(find dist/release-assets -type f | sort)
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "$TAG already has a release: replacing its files and notes"
            # shellcheck disable=SC2086
            gh release upload "$TAG" $files --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file dist/release-notes.md
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $files --repo "$REPO" --verify-tag \
              --title "usbdac $VERSION" --notes-file dist/release-notes.md "${prerelease[@]}"
          fi
