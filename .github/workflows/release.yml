name: Release

# Library changes on main reserve a patch version. The build publishes its
# packages before creating the GitHub Release and its tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish, such as 0.1.0
        required: true
        type: string
      failed_run_id:
        description: Retry packaging from a verified failed automatic release run
        required: false
        type: string
      gate_run_id:
        description: Reuse a failed re-gating run payload with the original failed_run_id
        required: false
        type: string
      regate_run_id:
        description: Re-run all gates on the verified reserved source of a failed run
        required: false
        type: string
      skip_package:
        description: Skip both Android Maven uploads if GitHub Packages already has this version
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize reservations and publications; an advanced main gets its own run.
  group: usbdac-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2

jobs:
  prepare:
    name: Select the release version and source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      packages: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      recovered: ${{ steps.source.outputs.recovered }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_run_attempt: ${{ steps.source.outputs.source_run_attempt }}
      source_repository: ${{ steps.source.outputs.source_repository }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      receipt_id: ${{ steps.source.outputs.receipt_id }}
      android_validator_id: ${{ steps.source.outputs.android_validator_id }}
      mac_validator_id: ${{ steps.source.outputs.mac_validator_id }}
      reservation_run_id: ${{ steps.source.outputs.reservation_run_id }}
      validator: ${{ steps.validator.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select and verify the release source
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          REGATE_RUN_ID: ${{ inputs.regate_run_id }}
          GATE_RUN_ID: ${{ inputs.gate_run_id }}
          SKIP_PACKAGE: ${{ inputs.skip_package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FAILED_RUN_ID" ] && [ -n "$REGATE_RUN_ID" ]; then
            echo "Choose recovery or re-gating, not both"; exit 1
          fi
          if [ -n "$GATE_RUN_ID" ] && [ -z "$FAILED_RUN_ID" ]; then
            echo "A gate run ID requires the original failed run ID"; exit 1
          fi
          if [ -n "$REGATE_RUN_ID" ]; then
            python3 .github/scripts/recover_release.py --regate-run-id "$REGATE_RUN_ID" --version "$RELEASE_VERSION" --output "$GITHUB_OUTPUT"
          elif [ -n "$FAILED_RUN_ID" ]; then
            if [ -n "$GATE_RUN_ID" ]; then
              python3 .github/scripts/recover_release.py --failed-run-id "$FAILED_RUN_ID" --gate-run-id "$GATE_RUN_ID" --version "$RELEASE_VERSION" --output "$GITHUB_OUTPUT"
            else
              python3 .github/scripts/recover_release.py --failed-run-id "$FAILED_RUN_ID" --version "$RELEASE_VERSION" --output "$GITHUB_OUTPUT"
            fi
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 .github/scripts/prepare_release.py --run-id "$GITHUB_RUN_ID" --source "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
            echo "reservation_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/prepare_release.py --version "$RELEASE_VERSION" --output "$GITHUB_OUTPUT"
            echo "reservation_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect validator sources in the selected commit
        id: validator
        if: steps.source.outputs.version != ''
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          found=0
          for path in crates/usbdac-validator/Cargo.toml android/validator/build.gradle.kts macos/validator/build.sh macos/validator/worker/Cargo.toml macos/validator/worker/Cargo.lock; do
            if git cat-file -e "$COMMIT:$path" 2>/dev/null; then found=$((found + 1)); fi
          done
          case "$found" in
            0) echo 'enabled=false' >> "$GITHUB_OUTPUT" ;;
            5) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Incomplete validator sources in $COMMIT"; exit 1 ;;
          esac

  release-gates:
    needs: prepare
    if: needs.prepare.outputs.version != '' && needs.prepare.outputs.recovered != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      reservation_run_id: ${{ needs.prepare.outputs.reservation_run_id }}
    permissions:
      contents: read

  mac-validator:
    name: Build the macOS validator
    needs: prepare
    if: ${{ needs.prepare.outputs.recovered != 'true' && needs.prepare.outputs.version != '' && needs.prepare.outputs.validator == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Build and verify the Apple Silicon app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_IDENTITY: ""
          SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rustup target add aarch64-apple-darwin
          macos/validator/build.sh
          app="macos/validator/build/USB DAC Validator.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          cp macos/validator/build/USB-DAC-Validator-macOS.zip "$RUNNER_TEMP/usbdac-validator-$VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: mac-validator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usbdac-validator-${{ needs.prepare.outputs.version }}-macos-arm64.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 14


  android-validator:
    name: Build the Android validator
    needs: prepare
    if: ${{ needs.prepare.outputs.recovered != 'true' && needs.prepare.outputs.version != '' && needs.prepare.outputs.validator == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Pin the Gradle distribution checksum
        run: |
          echo 'distributionSha256Sum=17f277867f6914d61b1aa02efab1ba7bb439ad652ca485cd8ca6842fccec6e43' >> android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Rust and Android toolchains
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}
      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and verify the validator APK
        working-directory: android
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ./gradlew :validator:assembleDebug --console=plain
          apk=validator/build/outputs/apk/debug/validator-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/validator-badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/validator-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          nm="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -p "$apk" "lib/$abi/libusbdac.so" > "$RUNNER_TEMP/validator-$abi.so"
            "$nm" --dynamic --defined-only "$RUNNER_TEMP/validator-$abi.so" > "$RUNNER_TEMP/validator-$abi.symbols"
            grep -q 'Java_dev_usbdac_internal_Native_validatorRun' "$RUNNER_TEMP/validator-$abi.symbols"
          done
          cp "$apk" "$RUNNER_TEMP/usbdac-validator-$VERSION-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: android-validator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usbdac-validator-${{ needs.prepare.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 14

  gate-receipt:
    name: Seal release gate evidence
    needs: [prepare, release-gates]
    if: needs.release-gates.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      receipt_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release-gates.outputs.artifact_id }}
          path: release-payload
      - name: Verify and record the immutable gate payload
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
          WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RESERVATION_RUN_ID: ${{ needs.prepare.outputs.reservation_run_id }}
          GATE_IDENTITY: usbdac-release-gates/v1
          ARTIFACT_ID: ${{ needs.release-gates.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.release-gates.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/release_artifact.py verify release-payload --version "$VERSION"
          mkdir gate-receipt
          python3 - <<'PYRECEIPT'
          import hashlib, json, os
          from pathlib import Path
          e = os.environ
          if not e['ARTIFACT_ID'] or not e['ARTIFACT_DIGEST']:
              raise SystemExit('Missing gate payload identity')
          if e['GATE_IDENTITY'] != 'usbdac-release-gates/v1':
              raise SystemExit('Unsupported or missing gate identity')
          receipt = dict(schema_version=2, gate_identity=e['GATE_IDENTITY'], repository=e['GITHUB_REPOSITORY'], version=e['VERSION'],
              source_sha=e['SOURCE_SHA'], workflow_sha=e['WORKFLOW_SHA'], run_id=int(e['SOURCE_RUN_ID']),
              run_attempt=int(e['SOURCE_RUN_ATTEMPT']), reservation_run_id=int(e['RESERVATION_RUN_ID']), artifact_id=int(e['ARTIFACT_ID']),
              artifact_digest='sha256:' + e['ARTIFACT_DIGEST'].removeprefix('sha256:'), manifest_sha256=hashlib.sha256(Path('release-payload/manifest.json').read_bytes()).hexdigest())
          Path('gate-receipt/receipt.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PYRECEIPT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-gate-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-receipt/receipt.json
          if-no-files-found: error
          retention-days: 90

  package:
    name: Publish verified gate payload
    outputs:
      artifact_id: ${{ steps.release_assets.outputs.artifact-id }}
      repository: ${{ steps.repository.outputs.name }}
    needs: [prepare, release-gates, gate-receipt, mac-validator, android-validator]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.version != ''
      && (needs.gate-receipt.result == 'success' || (needs.prepare.outputs.recovered == 'true' && needs.gate-receipt.result == 'skipped'))
      && ((needs.prepare.outputs.validator == 'true' && needs.mac-validator.result == 'success' && needs.android-validator.result == 'success')
      || ((needs.prepare.outputs.validator == 'false' || needs.prepare.outputs.recovered == 'true')
      && needs.mac-validator.result == 'skipped' && needs.android-validator.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
      WORKFLOW_SHA: ${{ needs.prepare.outputs.workflow_sha || github.sha }}
      SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id || github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.prepare.outputs.source_run_attempt || github.run_attempt }}
      SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository || github.repository }}
      PAYLOAD_ID: ${{ needs.prepare.outputs.artifact_id || needs.release-gates.outputs.artifact_id }}
      RECEIPT_ID: ${{ needs.prepare.outputs.receipt_id || needs.gate-receipt.outputs.receipt_id }}
      ANDROID_VALIDATOR_ID: ${{ needs.prepare.outputs.android_validator_id || needs.android-validator.outputs.artifact_id }}
      MAC_VALIDATOR_ID: ${{ needs.prepare.outputs.mac_validator_id || needs.mac-validator.outputs.artifact_id }}
      SKIP_PACKAGE: ${{ inputs.skip_package }}
      RESERVATION_RUN_ID: ${{ needs.prepare.outputs.reservation_run_id }}
      VALIDATOR: ${{ needs.prepare.outputs.validator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the current repository name
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=$(gh api "repositories/$GITHUB_REPOSITORY_ID" --jq .full_name)
          [[ "$repository" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          echo "name=$repository" >> "$GITHUB_OUTPUT"
          echo "PUBLISH_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ steps.repository.outputs.name }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ env.PAYLOAD_ID }}
          path: release-payload
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ steps.repository.outputs.name }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ env.RECEIPT_ID }}
          path: gate-receipt
      - name: Verify gate receipt and payload
        run: |
          set -euo pipefail
          python3 -I .github/scripts/release_artifact.py verify release-payload --version "$VERSION"
          python3 - <<'PYCHECK'
          import hashlib, json, os
          from pathlib import Path
          e = os.environ
          r = json.loads(Path('gate-receipt/receipt.json').read_text())
          if r.get('schema_version') == 2 and r.get('gate_identity') != 'usbdac-release-gates/v1':
              raise SystemExit('Unsupported gate identity')
          if r.get('schema_version') not in (1, 2):
              raise SystemExit('Unsupported receipt schema')
          expected = dict(repository=e['SOURCE_REPOSITORY'], version=e['VERSION'],
              source_sha=e['SOURCE_SHA'], workflow_sha=e['WORKFLOW_SHA'], run_id=int(e['SOURCE_RUN_ID']),
              run_attempt=int(e['SOURCE_RUN_ATTEMPT']), reservation_run_id=int(e['RESERVATION_RUN_ID']), artifact_id=int(e['PAYLOAD_ID']),
              manifest_sha256=hashlib.sha256(Path('release-payload/manifest.json').read_bytes()).hexdigest())
          if any(r.get(k) != v for k, v in expected.items()):
              raise SystemExit('Gate receipt or manifest mismatch')
          PYCHECK
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - name: Install pinned Maven
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/maven.tgz" https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz
          echo 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  '"$RUNNER_TEMP/maven.tgz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Require validator artifact IDs
        if: needs.prepare.outputs.validator == 'true'
        run: |
          set -euo pipefail
          test -n "$ANDROID_VALIDATOR_ID"
          test -n "$MAC_VALIDATOR_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.validator == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ steps.repository.outputs.name }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ env.ANDROID_VALIDATOR_ID }}
          path: validator-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.validator == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ steps.repository.outputs.name }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ env.MAC_VALIDATOR_ID }}
          path: validator-assets
      - name: Verify validator assets before publication
        if: needs.prepare.outputs.validator == 'true'
        run: |
          set -euo pipefail
          test -s "validator-assets/usbdac-validator-$VERSION-android.apk"
          test -s "validator-assets/usbdac-validator-$VERSION-macos-arm64.zip"
          unzip -tq "validator-assets/usbdac-validator-$VERSION-android.apk" >/dev/null
          unzip -tq "validator-assets/usbdac-validator-$VERSION-macos-arm64.zip" >/dev/null
      - name: Publish and verify exact staged files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: python3 .github/scripts/publish_release.py
      - name: Assemble release assets from the verified payload
        run: |
          set -euo pipefail
          mkdir release-assets
          cp release-payload/assets/* release-payload/crates/*.crate release-payload/manifest.json gate-receipt/receipt.json release-assets/
          for artifact in usbdac usbdac-media3; do
            cp release-payload/maven/dev/usbdac/"$artifact"/"$VERSION"/* release-assets/
          done
          if [ "$VALIDATOR" = true ]; then
            cp "validator-assets/usbdac-validator-$VERSION-android.apk" "validator-assets/usbdac-validator-$VERSION-macos-arm64.zip" release-assets/
          fi
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)
          python3 .github/scripts/release_notes.py --output release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: release_assets
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error

  release:
    name: Create the GitHub Release
    needs: [prepare, package]
    if: needs.package.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      PUBLISH_REPOSITORY: ${{ needs.package.outputs.repository }}
    steps:
      - name: Require the staged release artifact ID
        env:
          RELEASE_ASSET_ID: ${{ needs.package.outputs.artifact_id }}
        run: test -n "$RELEASE_ASSET_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: dist
      - name: Create the release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          python3 - <<'PYRELEASE'
          import hashlib, json, os, subprocess, urllib.error, urllib.request
          from pathlib import Path
          e = os.environ
          repo, version, commit = e['PUBLISH_REPOSITORY'], e['VERSION'], e['COMMIT']
          def get(path):
              request = urllib.request.Request('https://api.github.com/' + path, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'usbdac-release/1'})
              request.add_unredirected_header('Authorization', 'Bearer ' + e['GH_TOKEN'])
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
          release = get(f'repos/{repo}/releases/tags/v{version}')
          tag_ref = get(f'repos/{repo}/git/ref/tags/v{version}')
          if tag_ref is not None:
              if tag_ref.get('ref') != f'refs/tags/v{version}':
                  raise SystemExit('Unexpected tag ref')
              obj = tag_ref.get('object') or {}
              for _ in range(16):
                  if obj.get('type') != 'tag':
                      break
                  annotated = get(f"repos/{repo}/git/tags/{obj.get('sha', '')}")
                  if annotated is None:
                      raise SystemExit('Annotated tag object is missing')
                  obj = annotated.get('object') or {}
              if obj.get('type') != 'commit' or obj.get('sha') != commit:
                  raise SystemExit('Existing tag does not resolve to the expected source')
          if release is not None:
              expected = {p.name: 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('dist/release-assets').iterdir() if p.is_file()}
              actual = {a['name']: a.get('digest') for a in release['assets']}
              notes = Path('dist/release-notes.md').read_text()
              if release.get('draft') or tag_ref is None or expected != actual or (release.get('body') or '').strip() != notes.strip():
                  raise SystemExit('Existing release, tag or asset digest differs; refusing replacement')
              print('Existing release and every asset match the verified payload')
          else:
              subprocess.run(['gh', 'release', 'create', f'v{version}', *map(str, sorted(Path('dist/release-assets').iterdir())),
                  '--repo', repo, '--target', commit, '--title', f'usbdac {version}',
                  '--notes-file', 'dist/release-notes.md'], check=True)
          PYRELEASE
      - name: Refresh the documentation after an automatic release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$PUBLISH_REPOSITORY" --ref main
