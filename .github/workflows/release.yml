name: Release

# Library changes on main reserve a patch version. The build publishes its
# packages before creating the GitHub Release and its tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish, such as 0.1.0
        required: true
        type: string
      failed_run_id:
        description: Retry packaging from a verified failed automatic release run
        required: false
        type: string
      skip_package:
        description: Skip both Android Maven uploads if GitHub Packages already has this version
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize reservations and publications; an advanced main gets its own run.
  group: usbdac-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2

jobs:
  prepare:
    name: Select the release version and source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      recovered: ${{ steps.source.outputs.recovered }}
      validator: ${{ steps.validator.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select and verify the release source
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          SKIP_PACKAGE: ${{ inputs.skip_package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FAILED_RUN_ID" ]; then
            python3 .github/scripts/recover_release.py --failed-run-id "$FAILED_RUN_ID" --version "$RELEASE_VERSION" --output "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 .github/scripts/prepare_release.py --run-id "$GITHUB_RUN_ID" --source "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/prepare_release.py --version "$RELEASE_VERSION" --output "$GITHUB_OUTPUT"
          fi

      - name: Detect validator sources in the selected commit
        id: validator
        if: steps.source.outputs.version != ''
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          found=0
          for path in crates/usbdac-validator/Cargo.toml android/validator/build.gradle.kts macos/validator/build.sh macos/validator/worker/Cargo.toml macos/validator/worker/Cargo.lock; do
            if git cat-file -e "$COMMIT:$path" 2>/dev/null; then found=$((found + 1)); fi
          done
          case "$found" in
            0) echo 'enabled=false' >> "$GITHUB_OUTPUT" ;;
            5) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Incomplete validator sources in $COMMIT"; exit 1 ;;
          esac

  release-gates:
    needs: prepare
    if: needs.prepare.outputs.version != '' && needs.prepare.outputs.recovered != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  mac-validator:
    name: Build the macOS validator
    needs: [prepare, release-gates]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.validator == 'true' && (needs.release-gates.result == 'success' || (needs.prepare.outputs.recovered == 'true' && needs.release-gates.result == 'skipped')) }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Build and verify the Apple Silicon app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_IDENTITY: ""
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          macos/validator/build.sh
          app="macos/validator/build/USB DAC Validator.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          cp macos/validator/build/USB-DAC-Validator-macOS.zip "$RUNNER_TEMP/usbdac-validator-$VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-validator
          path: ${{ runner.temp }}/usbdac-validator-${{ needs.prepare.outputs.version }}-macos-arm64.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build, test and publish the package
    needs: [prepare, release-gates, mac-validator]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.version != '' && (needs.release-gates.result == 'success' || (needs.prepare.outputs.recovered == 'true' && needs.release-gates.result == 'skipped')) && (needs.mac-validator.result == 'success' || (needs.prepare.outputs.validator == 'false' && needs.mac-validator.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust and the Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Plugin downloads from the Gradle and Maven repositories fail intermittently on
      # hosted runners. Resolve them first, with retries, so a transient outage does not
      # fail the build.
      - name: Resolve Gradle plugins (with retries)
        working-directory: android
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew help -Pusbdac.skipNative=true --console=plain -q; then exit 0; fi
            echo "Plugin resolution failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Build and inspect the Android validator APK
        if: needs.prepare.outputs.validator == 'true'
        working-directory: android
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew :validator:assembleDebug --console=plain
          apk=validator/build/outputs/apk/debug/validator-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/validator-badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/validator-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          nm="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -p "$apk" "lib/$abi/libusbdac.so" > "$RUNNER_TEMP/validator-$abi.so"
            "$nm" --dynamic --defined-only "$RUNNER_TEMP/validator-$abi.so" > "$RUNNER_TEMP/validator-$abi.symbols"
            grep -q 'Java_dev_usbdac_internal_Native_validatorRun' "$RUNNER_TEMP/validator-$abi.symbols"
          done
          cp "$apk" "$RUNNER_TEMP/validator.apk"
          rm -rf usbdac/src/main/jniLibs

      - name: Build the AAR (all four ABIs) and sample
        working-directory: android
        run: ./gradlew :usbdac:assembleRelease :usbdac-media3:assembleRelease :sample:assembleDebug :media3-example:assembleDebug --console=plain

      - name: Check that the AAR carries every ABI
        run: |
          listing=$(unzip -l android/usbdac/build/outputs/aar/usbdac-release.aar)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "$listing" | grep -q "jni/$abi/libusbdac.so" || { echo "jni/$abi/libusbdac.so is missing from the AAR"; exit 1; }
          done

      - name: Verify the published native libraries exclude the validator bridge
        if: needs.prepare.outputs.validator == 'true'
        run: |
          set -euo pipefail
          nm="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -p android/usbdac/build/outputs/aar/usbdac-release.aar "jni/$abi/libusbdac.so" > "$RUNNER_TEMP/library-$abi.so"
            "$nm" --dynamic --defined-only "$RUNNER_TEMP/library-$abi.so" > "$RUNNER_TEMP/library-$abi.symbols"
            if grep -q 'Java_dev_usbdac_internal_Native_validator' "$RUNNER_TEMP/library-$abi.symbols"; then echo "Validator bridge leaked into $abi AAR"; exit 1; fi
          done

      - name: Stage the Maven publication
        working-directory: android
        run: ./gradlew :usbdac:publishReleasePublicationToStagingRepository :usbdac-media3:publishReleasePublicationToStagingRepository --console=plain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.validator == 'true'
        with:
          name: mac-validator
          path: ${{ runner.temp }}/mac-validator

      - name: Verify validator release assets are present
        if: needs.prepare.outputs.validator == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -s "$RUNNER_TEMP/validator.apk"
          test -s "$RUNNER_TEMP/mac-validator/usbdac-validator-$VERSION-macos-arm64.zip"

      - name: Check whether the Rust crate version is published
        id: crates
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output "$RUNNER_TEMP/usbdac-core-index.jsonl" --write-out '%{http_code}' \
            https://index.crates.io/us/bd/usbdac-core)
          case "$status" in
            200)
              published=$(jq -s --arg version "$VERSION" 'any(.[]; .vers == $version)' \
                "$RUNNER_TEMP/usbdac-core-index.jsonl")
              ;;
            404) published=false ;;
            *) echo "crates.io index returned HTTP $status"; exit 1 ;;
          esac
          if [ "$published" = true ]; then
            crate="usbdac-core-$VERSION"
            published_commit=$(curl --fail --silent --show-error --retry 3 --max-time 30 \
              "https://static.crates.io/crates/usbdac-core/$crate.crate" |
              tar -xzOf - "$crate/.cargo_vcs_info.json" | jq -er '.git.sha1')
            if [ "$published_commit" != "$(git rev-parse HEAD)" ]; then
              echo "crates.io already has $crate from $published_commit. Rerun the original release build."; exit 1
            fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "usbdac-core $VERSION already published: $published"

      - name: Publish the Rust crate to crates.io
        if: steps.crates.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: cargo publish --locked --package usbdac-core

      - name: Check each Maven package before uploading
        id: maven
        if: ${{ !inputs.skip_package }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for artifact in usbdac usbdac-media3; do
            base="https://maven.pkg.github.com/$GITHUB_REPOSITORY/dev/usbdac/$artifact/$VERSION/$artifact-$VERSION"
            found=0
            for suffix in .aar .pom .module -sources.jar; do
              status=$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GITHUB_TOKEN" |
                curl --config - --silent --show-error --location --retry 3 --max-time 30 \
                  --output /dev/null --write-out '%{http_code}' "$base$suffix")
              case "$status" in
                200) found=$((found + 1)) ;;
                404) ;;
                *) echo "GitHub Packages returned HTTP $status for $artifact$suffix"; exit 1 ;;
              esac
            done
            case "$found" in
              0) echo "$artifact=false" >> "$GITHUB_OUTPUT" ;;
              4) echo "$artifact=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "The Maven upload for $artifact $VERSION is incomplete; repair it before retrying"; exit 1 ;;
            esac
          done

      - name: Publish the core to GitHub Packages
        if: ${{ !inputs.skip_package && steps.maven.outputs.usbdac != 'true' }}
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :usbdac:publishReleasePublicationToGitHubPackagesRepository --console=plain

      - name: Publish the Media3 integration to GitHub Packages
        if: ${{ !inputs.skip_package && steps.maven.outputs['usbdac-media3'] != 'true' }}
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :usbdac-media3:publishReleasePublicationToGitHubPackagesRepository --console=plain

      - name: Collect the release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISHED_MAVEN: ${{ !inputs.skip_package }}
          VALIDATOR: ${{ needs.prepare.outputs.validator }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          assets="$PWD/release-assets"
          mkdir -p "$assets"
          for artifact in usbdac usbdac-media3; do
            staged="android/build/staging/dev/usbdac/$artifact/$VERSION"
            cp "$staged/$artifact-$VERSION.aar" "$staged/$artifact-$VERSION-sources.jar" \
               "$staged/$artifact-$VERSION.pom" "$staged/$artifact-$VERSION.module" "$assets/"
          done

          if [ "$VALIDATOR" = true ]; then
            cp "$RUNNER_TEMP/validator.apk" "$assets/usbdac-validator-$VERSION-android.apk"
            cp "$RUNNER_TEMP/mac-validator/usbdac-validator-$VERSION-macos-arm64.zip" "$assets/"
          fi

          # The native libraries on their own, one directory per ABI.
          (cd android/usbdac/src/main/jniLibs && zip -r -X "$assets/usbdac-$VERSION-jniLibs.zip" .)

          # The Rust driver as a crate (sources only; libusb is compiled from the crates.io dependency).
          cargo package -p usbdac-core --allow-dirty --no-verify
          cp "target/package/usbdac-core-$VERSION.crate" "$assets/"
          cp docs/design/device-compatibility-candidates.md "$assets/"

          (cd "$assets" && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

          # Release notes from the commits since the previous tag.
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "$previous..HEAD"
            else
              git log --no-merges --pretty='- %s (%h)' HEAD
            fi
            echo
            echo "Source commit: \`$SOURCE_COMMIT\`"
            echo
            echo "## Files"
            echo
            if [ "$PUBLISHED_MAVEN" = true ]; then
              echo "- \`usbdac-$VERSION.aar\`, \`-sources.jar\`, \`.pom\`, \`.module\`: the Android library, also published to GitHub Packages as \`dev.usbdac:usbdac:$VERSION\`."
            else
              echo "- \`usbdac-$VERSION.aar\`, \`-sources.jar\`, \`.pom\`, \`.module\`: the Android library and its Maven metadata."
            fi
            if [ "$PUBLISHED_MAVEN" = true ]; then
              echo "- \`usbdac-media3-$VERSION.aar\`, \`-sources.jar\`, \`.pom\`, \`.module\`: the optional Media3 integration, also published as \`dev.usbdac:usbdac-media3:$VERSION\`."
            else
              echo "- \`usbdac-media3-$VERSION.aar\`, \`-sources.jar\`, \`.pom\`, \`.module\`: the optional Media3 integration and Maven metadata."
            fi
            echo "- \`usbdac-$VERSION-jniLibs.zip\`: \`libusbdac.so\` for arm64-v8a, armeabi-v7a, x86_64 and x86."
            echo "- \`usbdac-core-$VERSION.crate\`: the Rust USB DAC driver, also available as [usbdac-core $VERSION on crates.io](https://crates.io/crates/usbdac-core/$VERSION)."
            if [ "$VALIDATOR" = true ]; then
              echo "- \`usbdac-validator-$VERSION-android.apk\`: Android validator, signed with the CI debug key."
              echo "- \`usbdac-validator-$VERSION-macos-arm64.zip\`: Apple Silicon macOS validator, ad hoc signed and not notarized."
            fi
            echo "- \`device-compatibility-candidates.md\`: the source-backed decision list for future device-specific work."
            echo "- \`SHA256SUMS.txt\`: SHA-256 checksums of the files above."
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            release-assets/*
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create the GitHub Release
    needs: [prepare, package]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          files=(dist/release-assets/*)
          if draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$draft" = false ]; then
              echo "$TAG already has a published release"
              exit 0
            fi
            echo "$TAG already has a release: replacing its files and notes"
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --target "$COMMIT" --draft=false \
              --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --target "$COMMIT" \
              --title "usbdac $VERSION" --notes-file dist/release-notes.md
          fi

      - name: Refresh the documentation after an automatic release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
