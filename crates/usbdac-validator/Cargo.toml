[package]
name = "usbdac-validator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
usbdac-core = { path = "../usbdac-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
