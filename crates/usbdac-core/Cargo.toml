[package]
name = "usbdac-core"
description = "Direct USB DAC playback for Rust audio applications on Android and Linux, with PCM, DoP, native DSD and bit-perfect reporting."
repository = "https://github.com/johnneerdael/android-usbdac"
homepage = "https://johnneerdael.github.io/android-usbdac/"
documentation = "https://docs.rs/usbdac-core"
readme = "README.md"
keywords = ["audio", "usb", "dac", "dsd", "android"]
categories = ["multimedia::audio", "hardware-support"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.76"

[dependencies]
libc = "0.2"
libusb1-sys = "0.7"
log = "0.4"
once_cell = "1.19"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rusb = "0.9"
crossbeam-channel = "0.5"
base64 = "0.22"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[features]
# Defensive parser/decoder adapters for the standalone cargo-fuzz package.
fuzzing = []
