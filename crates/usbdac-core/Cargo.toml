[package]
name = "usbdac-core"
description = "Bit-perfect direct USB DAC output (UAC 1.0/2.0, PCM, DoP, native DSD) over usbfs, without the platform audio stack."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Derive serde::Serialize on the public data types (capabilities, stats, events).
serde = ["dep:serde"]

[dependencies]
libc = "0.2"
libusb1-sys = "0.7"
log = "0.4"
once_cell = "1.19"
parking_lot = "0.12"
rusb = "0.9"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"], optional = true }
