[package]
name = "usbdac-defensive-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
usbdac-core = { path = "../crates/usbdac-core", features = ["fuzzing"] }

[[bin]]
name = "defensive_parsers"
path = "fuzz_targets/defensive_parsers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
